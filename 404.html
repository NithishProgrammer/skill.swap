<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Recipro Skills</title>
    <style>
        :root {
            --bg-main: #f3f3f3;
            --bg-card: #9eabc9;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #1e1f1f;
            --text-secondary: #868686;
            --accent-blue: #38bdf8;
            --accent-hover: #0ea5e9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Clean Top Minimal Navbar to match a real SaaS app */
        .nav-header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-blue);
        }

        /* Main Section Grid split layout for high-end look */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .error-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 40px;
            align-items: center;
            max-width: 750px;
        }

        .status-code {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            color: transparent;
            background: linear-gradient(180deg, #fd7289 30%, #f7222d 100%);
            -webkit-background-clip: text;
            background-clip: text;
            letter-spacing: -4px;
            padding-right: 40px;
            border-right: 2px solid var(--border-color);
        }

        .content-side h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .content-side p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 460px;
        }

        /* Action Rows */
        .action-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: #0b0f19;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Minimal Bottom Footer Layout */
        .app-footer {
            width: 100%;
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .footer-powered {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-powered a {
            display: flex;
            align-items: center;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .footer-powered a:hover {
            opacity: 1;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .nav-header, .app-footer {
                padding: 20px;
            }
            .error-grid {
                grid-template-columns: 100%;
                gap: 20px;
                text-align: center;
            }
            .status-code {
                border-right: none;
                padding-right: 0;
                font-size: 6rem;
                border-bottom: 2px solid var(--border-color);
                padding-bottom: 20px;
            }
            .content-side p {
                margin: 0 auto 30px auto;
            }
            .action-group {
                justify-content: center;
                flex-direction: column;
                width: 100%;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation Section -->
    <header class="nav-header">
        <a href="index" class="logo"> <img src="https://raw.githubusercontent.com/NithishProgrammer/skill.swap/refs/heads/main/S-removebg-preview.png" width="50" height="50" alt="Logo"> </a>
    </header>

    <!-- Core Interactive Error Info Grid -->
    <main class="main-content">
        <div class="error-grid">
            <div class="status-code">404</div>
            <div class="content-side">
                <h1>Page not found</h1>
                <p>Sorry, we couldn’t find the page you’re looking for. It might have been moved, deleted, or the URL might be incorrect.</p>
                
                <div class="action-group">
                    <a href="index" class="btn btn-primary">Go to Dashboard</a>
                    <a href="mailto:nithishanaricle@gmail.com?subject=ReciproSkills%20Issue%20Report%20from%20Users" target="_blank" class="btn btn-secondary">Report an Issue</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Structured Footer Details -->
    <footer class="app-footer">
        <p>&copy; Reserved 2023</p>
        <div class="footer-powered">
            <span>Powered by</span>
            <a href="https://nithishprogrammer.github.io/Nithish" target="_blank" title="Developer Profile">
                <img src="https://nithishprogrammer.github.io/Nithish/home_icon.svg" alt="Nithish" width="32px">
            </a>
        </div>
    </footer>

</body>
</html>
